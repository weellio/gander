<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="An ESP board on USB drives a MOSFET gate through a 150 ohm resistor with a 10k pulldown. A separate 12 volt supply feeds the LED strip, whose negative leg goes to the MOSFET drain. The board ground, the MOSFET source and the supply ground all meet on one common ground rail.">
  <rect width="760" height="450" fill="#F5F7F9"/>

  <rect x="20" y="70" width="255" height="170" rx="10" fill="#E7EEF4"/>
  <rect x="440" y="20" width="300" height="215" rx="10" fill="#FAEDE7"/>
  <text x="32" y="90" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#66727F">USB 5V</text>
  <text x="452" y="40" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#66727F">12V · SEPARATE SUPPLY</text>

  <rect x="50" y="105" width="190" height="115" rx="8" fill="#FFFFFF" stroke="#15202B" stroke-width="1.5"/>
  <text x="145" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#15202B">ESP board</text>
  <text x="145" y="165" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#66727F">USB powered</text>
  <text x="234" y="136" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#15202B">GPIO</text>
  <text x="126" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">GND</text>

  <rect x="470" y="40" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#15202B" stroke-width="1.5"/>
  <text x="555" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#15202B">12V supply</text>
  <text x="555" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#66727F">own brick</text>

  <rect x="470" y="150" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#15202B" stroke-width="1.5"/>
  <text x="590" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#15202B">LED strip</text>
  <text x="590" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#66727F">one colour</text>

  <rect x="380" y="285" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#15202B" stroke-width="1.5"/>
  <text x="455" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#15202B">N-MOSFET</text>
  <text x="455" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#66727F">logic level</text>
  <text x="372" y="330" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#15202B">G</text>
  <text x="462" y="278" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">D</text>
  <text x="462" y="382" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">S</text>

  <line x1="505" y1="94" x2="505" y2="150" stroke="#C0431C" stroke-width="2.5"/>
  <text x="513" y="126" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#C0431C">+12V</text>
  <text x="513" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#C0431C">+</text>

  <polyline points="505,206 505,250 455,250 455,285" fill="none" stroke="#15202B" stroke-width="2.5"/>
  <text x="513" y="220" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">−</text>
  <text x="480" y="243" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#15202B">to drain</text>

  <polyline points="605,94 605,110 730,110 730,400" fill="none" stroke="#15202B" stroke-width="2.5"/>
  <text x="722" y="300" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#15202B">supply GND</text>

  <polyline points="240,140 272,140 272,325 380,325" fill="none" stroke="#17745A" stroke-width="2.5"/>
  <text x="248" y="132" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#17745A">PWM</text>
  <rect x="264" y="200" width="16" height="34" rx="2" fill="#FFFFFF" stroke="#15202B" stroke-width="1.5"/>
  <text x="288" y="221" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">150Ω</text>

  <line x1="330" y1="325" x2="330" y2="400" stroke="#15202B" stroke-width="2"/>
  <rect x="322" y="350" width="16" height="34" rx="2" fill="#FFFFFF" stroke="#15202B" stroke-width="1.5"/>
  <text x="314" y="372" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#15202B">10kΩ</text>

  <line x1="455" y1="365" x2="455" y2="400" stroke="#15202B" stroke-width="2.5"/>
  <line x1="120" y1="220" x2="120" y2="400" stroke="#15202B" stroke-width="2.5"/>
  <text x="112" y="320" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#15202B">board GND</text>

  <line x1="100" y1="400" x2="745" y2="400" stroke="#15202B" stroke-width="3.5"/>
  <circle cx="120" cy="400" r="4.5" fill="#15202B"/>
  <circle cx="330" cy="400" r="4.5" fill="#15202B"/>
  <circle cx="455" cy="400" r="4.5" fill="#15202B"/>
  <circle cx="730" cy="400" r="4.5" fill="#15202B"/>

  <text x="420" y="424" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.2" text-anchor="middle" fill="#C0431C">COMMON GROUND</text>
  <text x="420" y="440" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" text-anchor="middle" fill="#66727F">board GND · MOSFET source · supply GND all land here</text>

  <text x="590" y="228" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" text-anchor="middle" fill="#C0431C">12V never touches the board</text>
</svg>
