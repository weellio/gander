<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="An ESP board powered by USB connects to a WS2812 strip with three wires: 5 volts, ground, and a data line from a GPIO pin.">
  <rect width="760" height="250" fill="#F5F7F9"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#15202B"/>
    </marker>
  </defs>

  <line x1="22" y1="120" x2="54" y2="120" stroke="#15202B" stroke-width="2" marker-end="url(#ah)"/>
  <text x="22" y="108" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">USB</text>

  <rect x="60" y="60" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#15202B" stroke-width="1.5"/>
  <text x="160" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#15202B">ESP board</text>
  <text x="160" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#66727F">USB powered</text>
  <text x="254" y="99" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#15202B">5V</text>
  <text x="254" y="129" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#15202B">GND</text>
  <text x="254" y="159" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#15202B">GPIO</text>

  <rect x="520" y="60" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#15202B" stroke-width="1.5"/>
  <text x="620" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#15202B">WS2812 strip</text>
  <text x="620" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#66727F">addressable</text>
  <text x="526" y="99" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">+5V</text>
  <text x="526" y="129" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">GND</text>
  <text x="526" y="159" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#15202B">DIN</text>

  <line x1="260" y1="95" x2="520" y2="95" stroke="#C0431C" stroke-width="2.5"/>
  <line x1="260" y1="125" x2="520" y2="125" stroke="#15202B" stroke-width="2.5"/>
  <line x1="260" y1="155" x2="520" y2="155" stroke="#17745A" stroke-width="2.5"/>
  <text x="390" y="87" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#C0431C">5V</text>
  <text x="390" y="117" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#15202B">GND</text>
  <text x="390" y="147" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#17745A">DATA</text>

  <text x="390" y="218" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" text-anchor="middle" fill="#66727F">LED_PIN  ·  4 (D2) on D1 mini  ·  8 on C3  ·  48 on S3</text>
</svg>
